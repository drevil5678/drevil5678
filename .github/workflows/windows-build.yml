name: Build Windows test package

on:
  workflow_dispatch:
  push:
    branches:
      - codex/yanghai-local-test

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked build and test dependencies
        shell: pwsh
        run: |
          python -m pip install uv==0.12.19
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --group build --group dev --python 3.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test on Windows
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Build Windows portable package
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts\build_portable.py --output dist\yanghai-windows-lan-v0.3.3
      - name: Check bundled KataGo using real analysis
        shell: pwsh
        run: .\dist\yanghai-windows-lan-v0.3.3\YanghaiTournament.exe --check --no-pause
      - name: Check built-in 18-team startup and credential preservation on restart
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts\roster_smoke.py --executable dist\yanghai-windows-lan-v0.3.3\YanghaiTournament.exe
      - name: Check LAN package with real AI and 50 clients
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts\lan_smoke.py --executable dist\yanghai-windows-lan-v0.3.3\YanghaiTournament.exe
      - name: Check offline two-person practice and formal data isolation
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts\practice_smoke.py --executable dist\yanghai-windows-lan-v0.3.3\YanghaiTournament.exe
      - name: Provide downloadable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: yanghai-windows-lan-v0.3.3
          path: |
            dist/yanghai-windows-lan-v0.3.3.zip
            dist/yanghai-windows-lan-v0.3.3.zip.sha256
          if-no-files-found: error
          retention-days: 14
